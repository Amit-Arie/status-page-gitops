apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: status-page-ha
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Amit-Arie/status-page-gitops.git'
    targetRevision: HEAD
    path: ha
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: status-page
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
